[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math5320-portfolio-risk-system"
version = "0.2.0"
description = "Portfolio risk engine for stocks and European options with VaR, ES, and backtesting."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.32.0",
  "yfinance>=0.2.38",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scipy>=1.12.0",
  "plotly>=5.20.0",
  "pyarrow>=15.0.0",
]
keywords = [
  "risk-management",
  "value-at-risk",
  "expected-shortfall",
  "streamlit",
  "quant-finance",
  "coursework",
]
classifiers = [
  "Development Status :: 4 - Beta",
"Intended Audience :: Education",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/nl2992/MATH5320"
Repository = "https://github.com/nl2992/MATH5320"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "math5320_portfolio_risk_system*"]
exclude = ["tests*", "submission*", "notebooks*", "docs*", "data*"]
